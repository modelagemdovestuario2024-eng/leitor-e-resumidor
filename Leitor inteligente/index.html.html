<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor e Resumidor Inteligente</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #06b6d4;
      --secondary-hover: #0891b2;
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-main);
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 800px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 16px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      resize: vertical;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 20px;
    }

    .status {
      font-size: 0.85rem;
      color: #10b981;
      font-weight: 600;
    }

    .reading-status {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .voice-select-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    select {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background-color: #f9fafb;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    button {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      color: white;
    }

    .btn-primary { background-color: var(--primary); }
    .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

    .btn-warning { background-color: var(--warning); }
    .btn-warning:hover { background-color: var(--warning-hover); transform: translateY(-1px); }

    .btn-secondary { background-color: var(--secondary); }
    .btn-secondary:hover { background-color: var(--secondary-hover); transform: translateY(-1px); }

    .btn-danger { background-color: #f3f4f6; color: var(--danger); border: 1px solid #fee2e2; }
    .btn-danger:hover { background-color: #fee2e2; }

    .result-card {
      background-color: #f9fafb;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-card h3 {
      font-size: 1.05rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-content {
      font-size: 0.95rem;
      color: #374151;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      .app-container { padding: 20px; }
      .controls-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1><span>🎧</span> Leitor & Resumidor</h1>
      <p>Cole seu texto abaixo para ouvir com voz suave ou gerar um resumo instantâneo.</p>
    </div>

    <div class="input-section">
      <label for="textoInput">Texto original:</label>
      <textarea id="textoInput" placeholder="Cole ou digite seu texto aqui..."></textarea>
      <div class="status-bar">
        <div id="statusSalvo" class="status"></div>
        <div id="statusLeitura" class="reading-status"></div>
      </div>
    </div>

    <div class="voice-select-container">
      <label for="selectVoz">Selecione a voz de leitura:</label>
      <select id="selectVoz">
        <option value="">Carregando vozes do sistema...</option>
      </select>
    </div>

    <div class="controls-grid">
      <button class="btn-primary" onclick="iniciarLeituraDoInicio()">▶ Iniciar</button>
      <button class="btn-warning" onclick="pausarLeitura()">⏸ Pausar</button>
      <button class="btn-primary" onclick="retomarLeitura()">▶ Continuar</button>
      <button class="btn-secondary" onclick="pararLeitura()">⏹ Parar</button>
      <button class="btn-primary" onclick="gerarResumo()">📝 Resumo</button>
      <button class="btn-danger" onclick="limparTudo()">🗑️ Limpar</button>
    </div>

    <div class="result-card">
      <h3><span>✨</span> Resumo Gerado</h3>
      <div id="resultadoResumo" class="result-content">Nenhum resumo gerado ainda.</div>
    </div>
  </div>

  <script>
    const inputTexto = document.getElementById('textoInput');
    const displayResumo = document.getElementById('resultadoResumo');
    const statusSalvo = document.getElementById('statusSalvo');
    const statusLeitura = document.getElementById('statusLeitura');
    const selectVoz = document.getElementById('selectVoz');

    let vozesDisponiveis = [];
    let frasesTexto = [];
    let indiceFraseAtual = 0;
    let estaLendo = false;
    let estaPausado = false;

    // 1. CARREGAR E SELECIONAR VOZ FEMININA / SUAVE
    function carregarVozes() {
      vozesDisponiveis = window.speechSynthesis.getVoices();
      selectVoz.innerHTML = '';

      const vozesPT = vozesDisponiveis.filter(v => v.lang.includes('pt'));

      if (vozesPT.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = "Voz padrão do sistema";
        selectVoz.appendChild(opt);
        return;
      }

      let vozSelecionadaIndex = 0;

      vozesPT.forEach((voz, index) => {
        const option = document.createElement('option');
        option.value = voz.name;
        option.textContent = `${voz.name} (${voz.lang})`;

        const nomeLower = voz.name.toLowerCase();
        if (nomeLower.includes('maria') || nomeLower.includes('luciana') || 
            nomeLower.includes('francisca') || nomeLower.includes('helena') || 
            nomeLower.includes('female') || nomeLower.includes('vitoria') ||
            nomeLower.includes('google português do brasil')) {
          vozSelecionadaIndex = index;
        }

        selectVoz.appendChild(option);
      });

      if (selectVoz.options[vozSelecionadaIndex]) {
        selectVoz.selectedIndex = vozSelecionadaIndex;
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = carregarVozes;
    }

    // 2. RECUPERAR DADOS SALVOS DO LOCALSTORAGE
    window.addEventListener('DOMContentLoaded', () => {
      carregarVozes();
      const textoSalvo = localStorage.getItem('app_texto');
      const resumoSalvo = localStorage.getItem('app_resumo');

      if (textoSalvo) inputTexto.value = textoSalvo;
      if (resumoSalvo) displayResumo.innerText = resumoSalvo;
    });

    // 3. SALVAMENTO AUTOMÁTICO
    inputTexto.addEventListener('input', () => {
      localStorage.setItem('app_texto', inputTexto.value);
      mostrarStatus('Salvo automaticamente ✓');
    });

    function mostrarStatus(msg) {
      statusSalvo.innerText = msg;
      setTimeout(() => { statusSalvo.innerText = ''; }, 2000);
    }

    function atualizarStatusLeitura(msg) {
      statusLeitura.innerText = msg;
    }

    // 4. CONTROLE ROBUSTO DE LEITURA (DIVISÃO EM FRASES)
    function prepararFrases(texto) {
      // Divide o texto por pontuações mantendo frases legíveis
      const regex = /[^.!?\n]+[.!?\n]*/g;
      const correspondencias = texto.match(regex);
      if (!correspondencias) return [texto];
      return correspondencias.map(f => f.trim()).filter(f => f.length > 0);
    }

    function lerFraseAtual() {
      if (!estaLendo || estaPausado) return;

      if (indiceFraseAtual >= frasesTexto.length) {
        pararLeitura();
        atualizarStatusLeitura('Leitura concluída');
        setTimeout(() => atualizarStatusLeitura(''), 3000);
        return;
      }

      const frase = frasesTexto[indiceFraseAtual];
      const utterance = new SpeechSynthesisUtterance(frase);

      const vozNome = selectVoz.value;
      const vozObjeto = vozesDisponiveis.find(v => v.name === vozNome);
      if (vozObjeto) utterance.voice = vozObjeto;

      utterance.lang = 'pt-BR';
      utterance.rate = 0.95;
      utterance.pitch = 1.15;

      utterance.onend = () => {
        if (estaLendo && !estaPausado) {
          indiceFraseAtual++;
          lerFraseAtual();
        }
      };

      utterance.onerror = (e) => {
        if (estaLendo && !estaPausado) {
          indiceFraseAtual++;
          lerFraseAtual();
        }
      };

      atualizarStatusLeitura(`Lendo trecho ${indiceFraseAtual + 1} de ${frasesTexto.length}...`);
      window.speechSynthesis.speak(utterance);
    }

    function iniciarLeituraDoInicio() {
      const texto = inputTexto.value;
      if (!texto.trim()) return alert('Por favor, cole um texto primeiro.');

      window.speechSynthesis.cancel();
      frasesTexto = prepararFrases(texto);
      indiceFraseAtual = 0;
      estaLendo = true;
      estaPausado = false;

      lerFraseAtual();
    }

    function pausarLeitura() {
      if (!estaLendo) return;
      
      estaPausado = true;
      window.speechSynthesis.cancel(); // Para o áudio atual com segurança sem perder a frase
      atualizarStatusLeitura('Leitura pausada ⏸');
    }

    function retomarLeitura() {
      const texto = inputTexto.value;
      if (!texto.trim()) return alert('Por favor, cole um texto primeiro.');

      // Se a leitura nunca foi iniciada ou o texto mudou, começa do início
      if (!estaLendo || frasesTexto.length === 0) {
        iniciarLeituraDoInicio();
        return;
      }

      if (estaPausado) {
        estaPausado = false;
        lerFraseAtual();
      }
    }

    function pararLeitura() {
      estaLendo = false;
      estaPausado = false;
      indiceFraseAtual = 0;
      window.speechSynthesis.cancel();
      atualizarStatusLeitura('');
    }

    // 5. RESUMO DE TEXTO
    function gerarResumo() {
      const texto = inputTexto.value;
      if (!texto.trim()) return alert('Por favor, cole um texto primeiro.');

      const frases = texto.match(/[^.!?]+[.!?]+/g) || [texto];
      let resumo = '';

      if (frases.length <= 2) {
        resumo = texto;
      } else {
        const qtdFrases = Math.max(1, Math.floor(frases.length * 0.4));
        resumo = frases.slice(0, qtdFrases).join(' ');
      }

      displayResumo.innerText = resumo;
      localStorage.setItem('app_resumo', resumo);
      mostrarStatus('Resumo salvo ✓');
    }

    // 6. LIMPAR TUDO
    function limparTudo() {
      if (confirm('Deseja realmente apagar o texto e o resumo salvos?')) {
        localStorage.removeItem('app_texto');
        localStorage.removeItem('app_resumo');
        inputTexto.value = '';
        displayResumo.innerText = 'Nenhum resumo gerado ainda.';
        pararLeitura();
        mostrarStatus('Dados apagados com sucesso.');
      }
    }
  </script>
</body>
</html>
